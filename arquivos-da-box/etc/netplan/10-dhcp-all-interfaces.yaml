# IP fixo da pihole-box (fora da faixa DHCP do roteador, que vai de .10 a .254). IPv6 continua automatico.
network:
  version: 2
  renderer: networkd
  ethernets:
    end0:
      dhcp4: no
      dhcp6: yes
      ipv6-privacy: yes
      addresses: [192.168.0.4/24]
      routes:
        - to: default
          via: 192.168.0.1
      nameservers:
        addresses: [127.0.0.1]
